name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails if coverage drops below the floor in each package's vitest.config.ts.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Placeholders: every route is dynamic, so the build never contacts Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # A throwaway local stack with every migration applied. Tests make their own
      # made-up accounts and data, and MSO is a local stand-in, so nothing leaves the runner.
      - name: Start Supabase
        working-directory: apps/web
        run: supabase start -x studio,imgproxy,vector,logflare,realtime,edge-runtime,supavisor,postgres-meta

      - name: Install browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        working-directory: apps/web
        run: npm run e2e

      # The repo is public, so these are too: test data must stay made up.
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
